name: CI

# Modeled on zfls's ci.yml. Every pull request and every push to main is
# checked with Zig 0.17.0: the unit tests build, the build for zfls's targets
# (rstd-check-zig017) and zig fmt. Pushes to dev are not run: what reaches dev
# is checked by its pull request, and dev as a whole by the pull request that
# releases it (to main); start the workflow by hand on dev to check it in
# between. A pull request that only changes the files listed in no-ci.txt
# (documentation, editor settings) skips the checks; the "CI" job, the check
# the rulesets require, passes then too.
#
# Versions: build.zig.zon holds the version the next release will have. When
# a push to main passes and changes the package (see changes.sh), the commit
# is tagged v<version>; publishing a GitHub release with built libraries is
# left out for now (the release job's last step). Changes are collected on the
# dev branch (pull requests target it) and released by merging dev into main.
# After a release, main is merged back into dev, where build.zig.zon is bumped
# to the next patch version; main keeps the released version. For a minor or
# major release, set the version in build.zig.zon on dev by hand. main takes
# no direct pushes; a push to main whose version is already tagged is checked
# but not released.

on:
  push:
    # (not dev: see the top)
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.17.0

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      sha: ${{ steps.ver.outputs.sha }}
      ci: ${{ steps.ver.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # matches, no_ci, keeps_package
          source .github/workflows/changes.sh

          # A pull request that only changes files of no-ci.txt skips CI;
          # pushes to main and runs started by hand never do
          ci=true
          if [ "$EVENT" = pull_request ]; then
            ci=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! matches "$f" "${no_ci[@]}"; then ci=true; echo "changed: $f"; break; fi
            done <<< "$(git diff --name-only "$BASE_SHA...HEAD")"
          fi
          echo "ci=$ci" >> "$GITHUB_OUTPUT"
          if [ "$ci" = false ]; then
            echo "Only files of no-ci.txt changed; skipping the checks." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          read_version() { sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon; }
          version=$(read_version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot read a MAJOR.MINOR.PATCH .version from build.zig.zon (got '$version')"
            exit 1
          fi
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          next_patch() { IFS=. read -r ma mi pa <<< "$1"; echo "$ma.$mi.$((pa + 1))"; }

          on_main=false
          if [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/main ]; then
            on_main=true
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              # main moved on: the run for the newer commit releases it all
              echo "main has moved past this commit; checking only" | tee -a "$GITHUB_STEP_SUMMARY"
              on_main=stale
            fi
          fi

          # Only changes that can change the package make a release (see
          # changes.sh); CI's own commits (version bumps, marked [skip ci])
          # do not count
          base=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
          if [ -n "$base" ]; then
            changed=$(git log --format= --name-only --invert-grep --grep='\[skip ci\]' "$base..HEAD" | sort -u)
          else
            changed=$(git ls-files)
          fi
          releasable=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -n "$base" ]; then
              keeps_package "$f" "$base" && continue
            else
              matches "$f" "${exempt[@]}" && continue
            fi
            releasable=true
            echo "changes the package: $f"
            break
          done <<< "$changed"

          release=false
          [ "$on_main" = true ] && [ "$releasable" = true ] && release=true

          if tagged "$version"; then
            next=$(next_patch "$version")
            while tagged "$next"; do next=$(next_patch "$next"); done
            if [ "$release" = true ]; then
              # main takes no pushes, and dev is bumped after each release
              echo "::warning::main holds v$version, which is already released; checking only. Set a newer version on dev and merge it."
              release=false
            fi
            version=$next
          fi
          sha=$(git rev-parse HEAD)
          {
            echo "version=$version"
            echo "release=$release"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "version $version at $sha; release: $release" | tee -a "$GITHUB_STEP_SUMMARY"

  version-check:
    name: Version is unreleased
    # also on a branch's run started by hand
    if: >-
      ${{ (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request that can change the package (see changes.sh) must
      # carry a version newer than the latest release (CI bumps dev after
      # each release; for a minor or major release, set it by hand)
      - name: Check build.zig.zon's version against the latest tag
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [ -n "$BASE_SHA" ] || BASE_SHA=$(git rev-parse origin/main)
          # keeps_package
          source .github/workflows/changes.sh
          fork=$(git merge-base "$BASE_SHA" HEAD)
          needs_version=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! keeps_package "$f" "$fork"; then needs_version=true; echo "changes the package: $f"; break; fi
          done <<< "$(git diff --name-only "$fork" HEAD)"
          if [ "$needs_version" = false ]; then
            echo "Nothing in the package changed; no version needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version=$(sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon)
          latest=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
          latest=${latest#v}
          if [ -z "$latest" ]; then
            echo "No release yet; v$version will be the first." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)
          if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
            echo "::error file=build.zig.zon::.version is $version, but v$latest is already released. Set it to a newer version (e.g. the next patch, minor or major)."
            exit 1
          fi
          echo "v$version is newer than the latest release v$latest." | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    name: Check (${{ matrix.name }})
    needs: version
    # skipped when only files of no-ci.txt changed
    if: ${{ needs.version.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit tests build
            run: zig build rstd-test-build -Dtest-host-off
          - name: zfls's targets
            run: zig build rstd-check-zig017 -Dtest-host-off
          - name: zig fmt
            run: zig fmt --check build build.zig build.zig.zon src tools test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: recursive

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      # Downloads (lazy ones too) are retried: a dropped connection to a
      # package host should not fail the run
      - name: Fetch dependencies
        if: ${{ matrix.name != 'zig fmt' }}
        run: |
          for wait in 15 30 60 120; do
            zig build --fetch=all && exit 0
            echo "::warning::fetching dependencies failed; retrying in ${wait}s"
            sleep "$wait"
          done
          zig build --fetch=all

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  ci-result:
    name: CI
    needs: [version, version-check, check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Results of the jobs before
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, check]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Tag the checked commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "rstd v$VERSION" "$SHA"
          git push origin "v$VERSION"

      # rstd is not distributed as a compiled library yet, so there are no
      # files to attach; publishing a release with built libraries is #166
      # (T164).
      # - name: Publish release
      #   uses: softprops/action-gh-release@v3
      #   with:
      #     tag_name: v${{ needs.version.outputs.version }}
      #     name: rstd v${{ needs.version.outputs.version }}
      #     files: dist/*
      #     generate_release_notes: true

  # The next version is begun on dev: main keeps the version it released. A
  # separate job, so that a push dev refuses does not undo the tag.
  begin-next-version:
    name: Merge v${{ needs.version.outputs.version }} into dev and begin the next version
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      # dev takes pushes only from pull requests whose checks pass, and from
      # this deploy key, which the dev ruleset lets bypass that (GITHUB_TOKEN
      # cannot be a bypass actor); without the secret the token is used
      DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # A fast-forward when dev has not moved, else a merge commit
      - name: Merge into dev and begin the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          push_to=origin
          if [ -n "$DEPLOY_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dev_deploy_key
            chmod 600 ~/.ssh/dev_deploy_key
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/dev_deploy_key -o IdentitiesOnly=yes"
            push_to="git@github.com:$GITHUB_REPOSITORY.git"
          fi
          for attempt in 1 2 3; do
            git fetch -q origin dev
            git checkout -q -B dev origin/dev
            if ! git merge -q -m "Merge v$VERSION into dev [skip ci]" "$SHA"; then
              # When build.zig.zon's .version is all that conflicts (a
              # version set on dev by hand), dev keeps its own
              if [ "$(git diff --name-only --diff-filter=U)" = build.zig.zon ]; then
                git show :1:build.zig.zon > "$RUNNER_TEMP/base.zon"
                git show :2:build.zig.zon > "$RUNNER_TEMP/dev.zon"
                git show :3:build.zig.zon > "$RUNNER_TEMP/release.zon"
                # (exits with the number of conflicts)
                git merge-file -p "$RUNNER_TEMP/dev.zon" "$RUNNER_TEMP/base.zon" "$RUNNER_TEMP/release.zon" \
                    > "$RUNNER_TEMP/marked.zon" || true
                if awk '/^<<<<<<< /{c=1;next} /^=======$/{next} /^>>>>>>> /{c=0;next} c && !/^\s*\.version = /{bad=1} END{exit bad}' \
                    "$RUNNER_TEMP/marked.zon"; then
                  git merge-file --ours "$RUNNER_TEMP/dev.zon" "$RUNNER_TEMP/base.zon" "$RUNNER_TEMP/release.zon"
                  cp "$RUNNER_TEMP/dev.zon" build.zig.zon
                  git add build.zig.zon
                  git commit -q --no-edit
                fi
              fi
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                git merge --abort
                echo "::error::v$VERSION conflicts with dev; merge main into dev by hand and set the next version"
                exit 1
              fi
            fi
            version=$(sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon)
            if tagged "$version"; then
              next=$version
              while tagged "$next"; do
                IFS=. read -r ma mi pa <<< "$next"
                next="$ma.$mi.$((pa + 1))"
              done
              sed -i -E "s/^(\s*\.version = \")[^\"]+(\",)/\1$next\2/" build.zig.zon
              git commit -qam "Begin v$next development [skip ci]"
            fi
            if git push -q "$push_to" dev; then exit 0; fi
            echo "dev moved while merging; trying again"
          done
          echo "::error::could not push to dev"
          exit 1
